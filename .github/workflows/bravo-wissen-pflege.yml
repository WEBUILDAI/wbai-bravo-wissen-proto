# [PROTOTYP] Wöchentliche Wissenspflege (S10).
# Findet Einträge mit gueltig_bis < heute, lässt Claude Aktualisierungen vorschlagen und
# öffnet einen PR auf einem claude/-Branch. Authentifizierung zur Claude API ausschließlich per
# Workload Identity Federation (GitHub OIDC), kein API-Key.
#
# Benötigte Repo-Variablen (Settings → Variables, keine Secrets):
#   ANTHROPIC_FEDERATION_RULE_ID  (fdrl_…)
#   ANTHROPIC_ORGANIZATION_ID     (UUID)
name: bravo-wissen-pflege

on:
  schedule:
    - cron: "17 5 * * 1" # montags 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bravo-wissen-pflege
  cancel-in-progress: false

jobs:
  pruefen:
    name: abgelaufene Einträge finden
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      anzahl: ${{ steps.liste.outputs.anzahl }}
      ids: ${{ steps.liste.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Liste
        id: liste
        run: |
          python scripts/validate.py --abgelaufen --json > abgelaufen.json
          echo "anzahl=$(jq length abgelaufen.json)" >> "$GITHUB_OUTPUT"
          echo "ids=$(jq -r 'map(.id) | join(",")' abgelaufen.json)" >> "$GITHUB_OUTPUT"
          jq . abgelaufen.json

  pflegen:
    name: Updates vorschlagen
    needs: pruefen
    if: needs.pruefen.outputs.anzahl != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write # GitHub OIDC für WIF zur Claude API
    env:
      BRANCH: claude/wissen-pflege-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt

      - name: Claude schlägt Updates vor
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Du pflegst das Wissens-Repo. Lies zuerst CLAUDE.md und schema/eintrag.schema.json.
            Heute ist der Stichtag; diese Einträge sind abgelaufen (gueltig_bis < heute):
            ${{ needs.pruefen.outputs.ids }}

            Für jeden Eintrag:
            1. Lies die Datei eintraege/<id>.md.
            2. Entscheide: (a) Inhalt ist weiterhin zutreffend → gueltig_bis um höchstens
               12 Monate verlängern und Inhalt bei Bedarf präzisieren, oder (b) Inhalt ist
               veraltet → Datei NICHT ändern, nur im Bericht zur Entfernung vorschlagen.
            3. Ausnahme: learning/pydantic-v1-kompatibilitaet ist ein absichtlich abgelaufener
               Testeintrag. Nie ändern, im Bericht nur erwähnen.

            Regeln: Schema und Frontmatter-Felder nicht ändern außer gueltig_bis und Inhalt;
            kunde bleibt wbai; keine Secrets; keine neuen Dateien unter eintraege/.
            Danach `make verify` ausführen; es muss grün sein.
            Schreibe zum Schluss einen kurzen Bericht auf Deutsch nach .pflege/bericht.md
            (je Eintrag: ID, Entscheidung, Begründung in einem Satz).
            Keine git-Befehle ausführen; Branch und PR legt der Workflow an.
          claude_args: >-
            --max-turns 15
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(make verify),Bash(make abgelaufen)"

      - name: Bericht lesen
        id: bericht
        run: |
          {
            echo "text<<BERICHT_EOF"
            cat .pflege/bericht.md 2>/dev/null || echo "Kein Bericht erzeugt."
            echo "BERICHT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Gate make verify
        run: make verify

      - name: PR anlegen
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ env.BRANCH }}
          base: main
          add-paths: eintraege/**
          commit-message: "chore(wissen): Pflege abgelaufener Einträge"
          title: "Wissenspflege: abgelaufene Einträge (${{ github.run_id }})"
          body: |
            [PROTOTYP] Wöchentliche Wissenspflege.

            Abgelaufen laut `make abgelaufen`: `${{ needs.pruefen.outputs.ids }}`

            ${{ steps.bericht.outputs.text }}

            Bitte fachlich prüfen; nicht automatisch mergen.
          delete-branch: true
