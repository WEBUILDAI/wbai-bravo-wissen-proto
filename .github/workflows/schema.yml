name: schema

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Abhängigkeiten
        run: python -m pip install -r requirements.txt
      - name: make verify
        run: make verify
      - name: Abgelaufene Einträge (Info)
        if: always()
        run: make abgelaufen
